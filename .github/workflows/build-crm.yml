
name: Construir Motriz CRM

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Baixar infraestrutura Frappe
        uses: actions/checkout@v7
        with:
          repository: frappe/frappe_docker
          ref: main
          path: builder

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Criar lista de aplicativos
        run: |
          mkdir -p builder/.github/tmp
          printf '[{"url":"https://github.com/frappe/crm","branch":"main"}]\n' > builder/.github/tmp/apps.json

      - name: Construir imagem Motriz CRM
        uses: docker/build-push-action@v7
        with:
          context: ./builder
          file: ./builder/images/layered/Containerfile
          platforms: linux/amd64
          load: true
          tags: ghcr.io/ricardowolffotografo-byte/motriz-crm:teste-2
          build-args: |
            FRAPPE_IMAGE_PREFIX=ghcr.io/frappe
            FRAPPE_BRANCH=version-16
            FRAPPE_PATH=https://github.com/frappe/frappe
          secret-files: |
            apps_json=./builder/.github/tmp/apps.json

      - name: Verificar instalacao do CRM
        run: |
          docker run --rm --entrypoint bash \
            ghcr.io/ricardowolffotografo-byte/motriz-crm:teste-2 \
            -lc 'ls -1 /home/frappe/frappe-bench/apps && test -d /home/frappe/frappe-bench/apps/frappe && test -d /home/frappe/frappe-bench/apps/crm'

      - name: Entrar no registro GitHub
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagem validada
        run: docker push ghcr.io/ricardowolffotografo-byte/motriz-crm:teste-2
